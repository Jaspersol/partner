<!DOCTYPE html>
<!--
  What Wikipedia answers when it decides the caller is not a person: an HTML wall, not JSON. The parser reaches
  this through its JSON failure branch, and the block detector is what tells the two apart — this must be a
  block, and a JSON error document must not be.
-->
<html lang="en">
<head><title>Attention Required! | Cloudflare</title></head>
<body>
  <div class="cf-error-details">
    <h1>Sorry, you have been blocked</h1>
    <p>Please complete the security check to access zh.wikipedia.org</p>
    <div id="challenge-platform"></div>
  </div>
</body>
</html>
