name: release

# Push a v* tag (v0.2.0) to build the installer and publish it as a GitHub release.
#
# The voice engines are not built here: the installer downloads them from the engines-v1 release, whose
# URLs and SHA-256 are the constants committed in src/Partner.Api/Voice/EnginePackage.cs.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish; leave empty for a build-only run
        required: false
      publish:
        description: Create or refresh the GitHub release with the installer
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag != '' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  app:
    runs-on: windows-latest
    permissions:
      contents: read
    # The whole job took ~14 minutes on a warm cache, nearly half of it the installer build. 60 leaves room for
    # a cold cargo cache without letting a hung step (the smoke run waits on child processes) hold the runner.
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      commit: ${{ steps.target.outputs.commit }}
      manifest_hash: ${{ steps.stage.outputs.manifest_hash }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve target
        id: target
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_SHA: ${{ github.sha }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          $tag = if ($env:EVENT_NAME -eq 'push') { $env:REF_NAME } else { $env:INPUT_TAG }
          if ($env:PUBLISH -eq 'true' -and -not $tag) { throw 'Publishing requires an existing tag' }
          if ($tag -and $tag -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw 'Invalid version tag' }
          $commit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve build commit' }
          if ($env:EVENT_NAME -eq 'push' -and $commit -ne $env:EVENT_SHA) { throw 'Tag push commit and build commit do not match' }
          if ($tag) {
            $tagCommit = (git rev-parse "refs/tags/$tag^{commit}").Trim()
            if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $commit) { throw 'Tag and build commit do not match' }
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "commit=$commit" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Repo contracts
        run: |
          node scripts/check-docs.mjs
          node scripts/check-css-names.mjs

      # The engine URLs and SHA-256 are frozen constants in EnginePackage.cs, and nothing regenerates them at
      # build time any more, so this is what catches a bad pin before it ships: it compares the constants with
      # the digests GitHub stores for the published release. Read-only, no downloads.
      - name: Engine pins
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-engine-pins.mjs

      - name: Frontend dependencies
        run: npm --prefix ui ci

      # Live2D's Core and any model are user-supplied and must stay out of the tree. `.gitignore` is the habit;
      # this is the guarantee — a tracked `.moc3`, Core script or `model3.json` fails the build before the
      # frontend is packaged.
      - name: Live2D assets are untracked
        shell: bash
        run: |
          tracked=$(git ls-files '*.moc3' '*live2dcubismcore*' '*.model3.json')
          if [ -n "$tracked" ]; then
            echo "Live2D binaries must not be tracked:" >&2
            echo "$tracked" >&2
            exit 1
          fi

      - name: Version from the tag
        if: steps.target.outputs.tag != ''
        env:
          TARGET_TAG: ${{ steps.target.outputs.tag }}
        run: node scripts/set-version.mjs "$env:TARGET_TAG"

      - name: Build
        run: dotnet build Partner.sln -c Release --nologo

      - name: Unit tests
        run: dotnet test --nologo -c Release --no-build

      - name: Frontend unit and contract tests
        run: npm --prefix ui run test

      - name: Smoke and capability baseline
        run: dotnet run --project src/Partner.Smoke -c Release --no-build -- --verify-baseline capabilities/manifest.baseline.json

      - name: Publish the API sidecar
        run: dotnet publish src/Partner.Api -c Release -r win-x64 --self-contained true -o src/Partner.Api/bin/Release/net10.0/win-x64/publish -v q --nologo

      # PARTNER_PET defaults to enabled for both the shell and frontend.
      - name: Build the installer
        run: npm --prefix ui exec tauri build

      # The licence notice is an obligation on the shipped JavaScript, so it is checked on what the build emitted,
      # not on the source: every chunk that bundles the Cubism Framework must carry Live2D's copyright line. A
      # source-only test cannot see chunking.
      - name: Live2D notice in the built bundle
        run: node scripts/check-live2d-bundle.mjs

      - name: Stage and attest artifacts
        id: stage
        shell: pwsh
        env:
          TARGET_TAG: ${{ steps.target.outputs.tag }}
          TARGET_COMMIT: ${{ steps.target.outputs.commit }}
        run: |
          New-Item -ItemType Directory -Force release-artifact | Out-Null
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one installer' }
          if ($env:TARGET_TAG) {
            $version = $env:TARGET_TAG.Substring(1)
            $uiVersion = (Get-Content -Raw ui/package.json | ConvertFrom-Json).version
            $shellVersion = (Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json).version
            $cargo = Get-Content -Raw src-tauri/Cargo.toml
            if ($uiVersion -ne $version -or $shellVersion -ne $version -or $cargo -notmatch "(?m)^version = `"$([regex]::Escape($version))`"\r?$") { throw 'Application versions do not match the tag' }
            if ($installers[0].Name -ne "Partner_${version}_x64-setup.exe") { throw 'Installer name does not match the tag' }
          }
          Copy-Item $installers[0].FullName release-artifact/
          Copy-Item THIRD-PARTY-NOTICES.md release-artifact/
          Copy-Item src/Partner.Api/Voice/EnginePackage.cs release-artifact/
          $notes = ".github/release-notes/$env:TARGET_TAG.md"
          if ($env:TARGET_TAG -and (Test-Path $notes)) { Copy-Item $notes release-artifact/notes.md }
          $hashes = @{}
          Get-ChildItem release-artifact -File | ForEach-Object { $hashes[$_.Name] = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() }
          $manifest = @{ tag = $env:TARGET_TAG; commit = $env:TARGET_COMMIT; hashes = $hashes } | ConvertTo-Json
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) 'release-artifact/manifest.json'), $manifest, [System.Text.UTF8Encoding]::new($false))
          "manifest_hash=$((Get-FileHash release-artifact/manifest.json -Algorithm SHA256).Hash.ToLower())" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: partner-installer
          path: release-artifact/
          if-no-files-found: error

  publish:
    needs: app
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: partner-installer
          path: release-artifact
      - name: Verify and publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_TAG: ${{ needs.app.outputs.tag }}
          TARGET_COMMIT: ${{ needs.app.outputs.commit }}
          MANIFEST_HASH: ${{ needs.app.outputs.manifest_hash }}
        run: |
          $tag = $env:TARGET_TAG
          if (-not $tag -or $tag -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw 'Invalid release tag' }
          if ((Get-FileHash release-artifact/manifest.json -Algorithm SHA256).Hash.ToLower() -ne $env:MANIFEST_HASH) { throw 'Manifest digest mismatch' }
          $manifest = Get-Content -Raw release-artifact/manifest.json | ConvertFrom-Json
          if ($manifest.tag -ne $tag -or $manifest.commit -ne $env:TARGET_COMMIT) { throw 'Manifest target mismatch' }
          foreach ($entry in $manifest.hashes.PSObject.Properties) {
            if ($entry.Name -ne (Split-Path $entry.Name -Leaf)) { throw 'Invalid artifact name' }
            if ((Get-FileHash "release-artifact/$($entry.Name)" -Algorithm SHA256).Hash.ToLower() -ne $entry.Value) { throw "Digest mismatch: $($entry.Name)" }
          }
          $actual = @(Get-ChildItem release-artifact -File | Where-Object Name -ne 'manifest.json')
          if ($actual.Count -ne @($manifest.hashes.PSObject.Properties).Count) { throw 'Unexpected artifact files' }
          $remoteCommit = gh api "repos/$env:GITHUB_REPOSITORY/commits/$tag" --jq .sha
          if ($LASTEXITCODE -ne 0 -or $remoteCommit -ne $env:TARGET_COMMIT) { throw 'Tag no longer points at the build commit' }
          $installers = @(Get-ChildItem release-artifact/*.exe | ForEach-Object { $_.FullName })
          if ($installers.Count -ne 1 -or (Split-Path $installers[0] -Leaf) -ne "Partner_$($tag.Substring(1))_x64-setup.exe") { throw 'Installer name does not match tag' }
          $files = $installers + @('release-artifact/THIRD-PARTY-NOTICES.md')

          # The updater has two paths and refuses an installer it cannot verify: the GitHub REST API path reads
          # <installer>.exe.sha256, the direct-link fallback reads the SHA256SUMS.txt manifest. Publish both.
          $perInstaller = foreach ($installer in $installers) {
            $name = Split-Path $installer -Leaf
            $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
            # ASCII, no BOM: the updater picks the 64-hex token out of this file.
            [System.IO.File]::WriteAllText("$installer.sha256", ("$hash *$name`n"), [System.Text.UTF8Encoding]::new($false))
            "$installer.sha256"
          }

          $lines = foreach ($file in $files) {
            $name = Split-Path $file -Leaf
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $name"
          }
          # LF, not the CRLF `Set-Content` writes: `sha256sum -c SHA256SUMS.txt` reads the \r as part of the
          # file name and reports every line as missing. An absolute path keeps [System.IO.File] (which uses the
          # process working directory) and the relative paths `gh` resolves in the same place.
          $sumsPath = Join-Path (Get-Location) 'SHA256SUMS.txt'
          [System.IO.File]::WriteAllText($sumsPath, (($lines -join "`n") + "`n"), [System.Text.UTF8Encoding]::new($false))
          $files += $sumsPath
          $files += $perInstaller

          # Release notes come from the repository, one file per tag, so a published release can be reviewed
          # and corrected like anything else instead of being typed into a workflow string. English is the
          # default: `.github/release-notes/<tag>.md`, with `.zh-CN.md` and `.zh-TW.md` beside it and linked
          # from its header. A tag with no file still publishes, with the installer blurb alone — the pipeline
          # must not fail because someone forgot the notes.
          $notesFile = 'release-artifact/notes.md'
          $notes = if (Test-Path $notesFile) {
            (Get-Content -Raw $notesFile).TrimEnd()
          } else {
            "Installer for $tag."
          }

          # Name the engine release the build actually pins by reading it back out of the constants, so the
          # notes cannot end up pointing at engines-v1 after the pins moved to engines-v2.
          $engineTag = [regex]::Match(
            (Get-Content -Raw 'release-artifact/EnginePackage.cs'),
            'releases/download/(engines-v\d+)/').Groups[1].Value
          if (-not $engineTag) { throw 'cannot read the pinned engine tag out of EnginePackage.cs' }

          $notes += "`n`n---`n`n" + "The voice engines are downloaded from the $engineTag release on first use; their URLs and SHA-256 are pinned in this build. " + 'The app code is MIT licensed; the engine runtimes and model weights keep their own licences, see THIRD-PARTY-NOTICES.md in the release assets.'

          # `gh release list` only returns the 30 newest releases, so an older tag looked missing and `create`
          # then failed with "release already exists". Ask for the tag itself.
          $existing = $false
          & gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { $existing = $true }

          $notesPath = Join-Path ([System.IO.Path]::GetTempPath()) "partner-notes-$tag.md"
          [System.IO.File]::WriteAllText($notesPath, $notes, [System.Text.UTF8Encoding]::new($false))

          if ($existing) {
            & gh release upload $tag $files --clobber
            if ($LASTEXITCODE -eq 0) { & gh release edit $tag --notes-file $notesPath }
          } else {
            & gh release create $tag $files --verify-tag --title "Partner $tag" --notes-file $notesPath
          }
          if ($LASTEXITCODE -ne 0) { throw 'gh release failed' }
