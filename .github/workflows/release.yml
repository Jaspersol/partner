name: release

# Push a v* tag (v0.2.0) to build the installer and publish it as a GitHub release.
#
# The voice engines are not built here: the installer downloads them from the engines-v1 release, whose
# URLs and SHA-256 are the constants committed in src/Partner.Api/Voice/EnginePackage.cs.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish; leave empty for a build-only run
        required: false
      publish:
        description: Create or refresh the GitHub release with the installer
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  app:
    runs-on: windows-latest
    # The whole job took ~14 minutes on a warm cache, nearly half of it the installer build. 60 leaves room for
    # a cold cargo cache without letting a hung step (the smoke run waits on child processes) hold the runner.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Repo contracts
        run: |
          node scripts/check-docs.mjs
          node scripts/check-css-names.mjs

      # The engine URLs and SHA-256 are frozen constants in EnginePackage.cs, and nothing regenerates them at
      # build time any more, so this is what catches a bad pin before it ships: it compares the constants with
      # the digests GitHub stores for the published release. Read-only, no downloads.
      - name: Engine pins
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-engine-pins.mjs

      - name: Frontend dependencies
        run: npm --prefix ui ci

      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/set-version.mjs "${{ github.ref_name }}"

      - name: Build
        run: dotnet build Partner.sln -c Release --nologo

      - name: Unit tests
        run: dotnet test --nologo -c Release --no-build

      - name: Frontend unit and contract tests
        run: npm --prefix ui run test

      - name: Smoke and capability baseline
        run: dotnet run --project src/Partner.Smoke -c Release --no-build -- --verify-baseline capabilities/manifest.baseline.json

      - name: Publish the API sidecar
        run: dotnet publish src/Partner.Api -c Release -r win-x64 --self-contained true -o src/Partner.Api/bin/Release/net10.0/win-x64/publish -v q --nologo

      - name: Build the installer
        run: npm --prefix ui exec tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: partner-installer
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The tag comes from the ref, not from `ref_name -like 'v*'`: a branch called `v2-dev` would otherwise
          # be published as if it were an app tag.
          $fromTag = '${{ github.ref }}' -like 'refs/tags/*'
          $tag = if ($fromTag) { '${{ github.ref_name }}' } else { '${{ inputs.tag }}' }
          if (-not $tag) { throw 'no tag to publish' }

          $files = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object { $_.FullName })
          if ($files.Count -eq 0) { throw 'the installer was not built' }
          $files += 'THIRD-PARTY-NOTICES.md'

          $lines = foreach ($file in $files) {
            $name = Split-Path $file -Leaf
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $name"
          }
          # LF, not the CRLF `Set-Content` writes: `sha256sum -c SHA256SUMS.txt` reads the \r as part of the
          # file name and reports every line as missing.
          [System.IO.File]::WriteAllText('SHA256SUMS.txt', (($lines -join "`n") + "`n"), [System.Text.UTF8Encoding]::new($false))
          $files += 'SHA256SUMS.txt'

          # Name the engine release the build actually pins by reading it back out of the constants, so the
          # notes cannot end up pointing at engines-v1 after the pins moved to engines-v2.
          $engineTag = [regex]::Match(
            (Get-Content -Raw 'src/Partner.Api/Voice/EnginePackage.cs'),
            'releases/download/(engines-v\d+)/').Groups[1].Value
          if (-not $engineTag) { throw 'cannot read the pinned engine tag out of EnginePackage.cs' }

          $notes = "Installer for $tag. The voice engines are downloaded from the $engineTag release on first use; their URLs and SHA-256 are pinned in this build." + "`n`n" + 'The app code is MIT licensed; the engine runtimes and model weights keep their own licences, see THIRD-PARTY-NOTICES.md in the release assets.'

          # `gh release list` only returns the 30 newest releases, so an older tag looked missing and `create`
          # then failed with "release already exists". Ask for the tag itself.
          $existing = $false
          & gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { $existing = $true }

          if ($existing) {
            & gh release upload $tag $files --clobber
          } elseif ($fromTag) {
            & gh release create $tag $files --title "Partner $tag" --notes $notes
          } else {
            & gh release create $tag $files --target '${{ github.sha }}' --title "Partner $tag" --notes $notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'gh release failed' }
