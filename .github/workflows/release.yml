name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish; leave empty for a build-only run
        required: false
      engine_tag:
        description: Engine release tag the installer should download from
        required: false
        default: engines-v1
      publish:
        description: Create or refresh the GitHub release with the installer
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  ENGINE_TAG: ${{ inputs.engine_tag || 'engines-v1' }}
  ENGINE_TARGET: ${{ vars.ENGINE_TARGET_BRANCH || 'master' }}

jobs:
  engines:
    if: vars.ENGINE_RUNNER == 'true'
    runs-on: [self-hosted, windows, x64]
    steps:
      - uses: actions/checkout@v4

      - name: Pack the engines and upload them to the engine release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not (Get-Command gh -ErrorAction SilentlyContinue)) { throw 'gh is required on the engine runner' }
          if (-not (Test-Path engines/tts/model)) { throw 'engines/tts/model is missing on the engine runner' }
          powershell -ExecutionPolicy Bypass -File scripts/pack-engines.ps1 -UploadTag $env:ENGINE_TAG -Target $env:ENGINE_TARGET

  app:
    needs: engines
    if: always() && needs.engines.result != 'failure' && needs.engines.result != 'cancelled'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Repo contracts
        run: |
          node scripts/check-docs.mjs
          node scripts/check-css-names.mjs

      - name: Frontend dependencies
        run: npm --prefix ui ci

      - name: Pin the engine archives the installer will download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force dist/engines | Out-Null
          gh release download $env:ENGINE_TAG --pattern engines-manifest.json --dir dist/engines --clobber
          node scripts/apply-engines-manifest.mjs dist/engines/engines-manifest.json --check

      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/set-version.mjs "${{ github.ref_name }}"

      - name: Build
        run: dotnet build Partner.sln -c Release --nologo

      - name: Unit tests
        continue-on-error: true
        run: dotnet test --nologo -c Release --no-build

      - name: Publish the API sidecar
        run: dotnet publish src/Partner.Api -c Release -r win-x64 --self-contained true -o src/Partner.Api/bin/Release/net8.0/win-x64/publish -v q --nologo

      - name: Build the installer
        run: npm --prefix ui exec tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: partner-installer
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ('${{ github.ref_name }}' -like 'v*') { '${{ github.ref_name }}' } else { '${{ inputs.tag }}' }
          if (-not $tag) { throw 'no tag to publish' }

          $files = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object { $_.FullName })
          if ($files.Count -eq 0) { throw 'the installer was not built' }
          $files += (Join-Path 'dist/engines' 'engines-manifest.json')
          $files += 'THIRD-PARTY-NOTICES.md'

          $lines = foreach ($file in $files) {
            $name = Split-Path $file -Leaf
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $name"
          }
          $lines | Set-Content -Path SHA256SUMS.txt -Encoding utf8NoBOM
          $files += 'SHA256SUMS.txt'

          $notes = "Installer for $tag. The voice engines are downloaded from the $env:ENGINE_TAG release on first use; their URLs and SHA-256 are pinned in this build." + "`n`n" + 'The app code is MIT licensed; the engine runtimes and model weights keep their own licences, see THIRD-PARTY-NOTICES.md in the release assets.'

          $existing = & gh release list --json tagName -q '.[].tagName' | Where-Object { $_ -eq $tag }
          $fromTag = '${{ github.ref }}' -like 'refs/tags/*'
          if ($existing) {
            & gh release upload $tag $files --clobber
          } elseif ($fromTag) {
            & gh release create $tag $files --title "Partner $tag" --notes $notes
          } else {
            & gh release create $tag $files --target '${{ github.sha }}' --title "Partner $tag" --notes $notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'gh release failed' }
